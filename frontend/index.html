<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ResearchForm — Academic Survey & Analysis Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#efefec;
  --surface:#ffffff;--surface2:#f9f9f7;
  --border:#e5e4df;--border2:#d1d0ca;
  --text:#212121;--text2:#5a5a58;--text3:#8a8a87;
  --accent:#1a1a1a;--accent2:#3d3d3a;
  --green:#16a34a;--green-bg:#f0fdf4;
  --blue:#1d4ed8;--blue-bg:#eff6ff;
  --amber:#d97706;--amber-bg:#fffbeb;
  --red:#dc2626;--red-bg:#fef2f2;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.06);
  --radius:10px;--radius-lg:16px;--radius-xl:24px;
  --font-display:'DM Serif Display',Georgia,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --transition:0.2s ease;
}
[data-theme="dark"]{
  --bg:#121212;--bg2:#1a1a1a;--bg3:#222222;
  --surface:#1e1e1e;--surface2:#242424;
  --border:#2e2e2e;--border2:#3a3a3a;
  --text:#f0f0ee;--text2:#a8a8a5;--text3:#6a6a67;
  --accent:#f0f0ee;--accent2:#c8c8c5;
  --green:#4ade80;--green-bg:#052e16;
  --blue:#60a5fa;--blue-bg:#1e3a5f;
  --amber:#fbbf24;--amber-bg:#431407;
  --red:#f87171;--red-bg:#450a0a;
  --purple:#a78bfa;--purple-bg:#2e1065;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.4),0 2px 4px -2px rgba(0,0,0,.3);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.4),0 4px 6px -4px rgba(0,0,0,.3);
}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  transition:background var(--transition),color var(--transition);
}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ====== SCROLLBAR ====== */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ====== TYPOGRAPHY ====== */
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.2;color:var(--text)}
h1{font-size:clamp(2rem,5vw,3.5rem)}
h2{font-size:clamp(1.5rem,3vw,2.2rem)}
h3{font-size:1.3rem}
p{color:var(--text2);line-height:1.7}
a{color:inherit;text-decoration:none}

/* ====== LAYOUT ====== */
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.section{padding:80px 0}

/* ====== NAVBAR ====== */
.navbar{
  position:sticky;top:0;z-index:100;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.navbar-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;max-width:1200px;margin:0 auto;
}
.logo{
  display:flex;align-items:center;gap:10px;cursor:pointer;
}
.logo-mark{
  width:36px;height:36px;border-radius:10px;
  background:var(--text);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.logo-mark svg{color:var(--bg)}
.logo-text{font-family:var(--font-display);font-size:1.25rem;color:var(--text);font-weight:400}
.logo-text span{color:var(--text3)}

.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{
  padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:500;
  color:var(--text2);cursor:pointer;transition:all var(--transition);
  border:none;background:none;font-family:inherit;
}
.nav-link:hover,.nav-link.active{background:var(--bg3);color:var(--text)}

.nav-actions{display:flex;align-items:center;gap:8px}
.theme-btn{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:none;cursor:pointer;color:var(--text2);
  display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);
}
.theme-btn:hover{background:var(--bg3);color:var(--text)}

/* ====== BUTTONS ====== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 20px;border-radius:8px;font-size:.875rem;font-weight:600;
  font-family:inherit;border:none;cursor:pointer;transition:all var(--transition);
  text-decoration:none;white-space:nowrap;
}
.btn-primary{background:var(--text);color:var(--bg)}
.btn-primary:hover{opacity:.85;transform:translateY(-1px)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border);border-color:var(--border2)}
.btn-ghost{background:none;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg2);color:var(--text)}
.btn-sm{padding:7px 14px;font-size:.8125rem}
.btn-lg{padding:14px 28px;font-size:1rem}
.btn-icon{width:36px;height:36px;padding:0}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}

/* ====== CARDS ====== */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:24px;
  box-shadow:var(--shadow);
}
.card-sm{padding:16px;border-radius:var(--radius)}

/* ====== FORM ELEMENTS ====== */
.form-group{margin-bottom:20px}
.form-label{
  display:block;font-size:.875rem;font-weight:600;
  color:var(--text);margin-bottom:6px;
}
.form-label span{color:var(--text3);font-weight:400;margin-left:4px}
.form-input,.form-select,.form-textarea{
  width:100%;padding:10px 14px;border-radius:8px;
  border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);
  font-family:inherit;font-size:.9rem;
  transition:border-color var(--transition),box-shadow var(--transition);
  outline:none;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  border-color:var(--text);
  box-shadow:0 0 0 3px rgba(0,0,0,.08);
}
.form-textarea{resize:vertical;min-height:100px}
.form-hint{font-size:.8125rem;color:var(--text3);margin-top:5px}
.form-error{font-size:.8125rem;color:var(--red);margin-top:5px}

/* ====== BADGES ====== */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:20px;
  font-size:.75rem;font-weight:600;letter-spacing:.01em;
}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-purple{background:var(--purple-bg);color:var(--purple)}
.badge-neutral{background:var(--bg3);color:var(--text2)}

/* ====== TABS ====== */
.tabs{display:flex;border-bottom:1px solid var(--border);gap:0;margin-bottom:24px}
.tab{
  padding:10px 20px;font-size:.875rem;font-weight:500;
  color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all var(--transition);border:none;background:none;
  font-family:inherit;
}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.tab:hover:not(.active){color:var(--text2)}

/* ====== SIDEBAR LAYOUT ====== */
.sidebar-layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 65px)}
.sidebar{
  border-right:1px solid var(--border);
  background:var(--bg2);padding:20px 0;
  position:sticky;top:65px;height:calc(100vh - 65px);
  overflow-y:auto;
}
.sidebar-section{padding:0 12px;margin-bottom:24px}
.sidebar-label{
  font-size:.7rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text3);padding:0 8px;margin-bottom:8px;
}
.sidebar-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;
  font-size:.875rem;font-weight:500;color:var(--text2);
  cursor:pointer;transition:all var(--transition);
  border:none;background:none;font-family:inherit;width:100%;text-align:left;
}
.sidebar-item:hover{background:var(--bg3);color:var(--text)}
.sidebar-item.active{background:var(--text);color:var(--bg)}
.sidebar-item svg{flex-shrink:0;opacity:.7}
.sidebar-item.active svg{opacity:1}
.sidebar-badge{
  margin-left:auto;min-width:20px;height:20px;
  border-radius:10px;background:var(--bg3);
  font-size:.7rem;font-weight:700;color:var(--text2);
  display:flex;align-items:center;justify-content:center;padding:0 6px;
}
.sidebar-item.active .sidebar-badge{background:rgba(255,255,255,.2);color:inherit}

/* ====== MAIN CONTENT ====== */
.main-content{padding:32px;overflow:auto}
.page-header{margin-bottom:32px}
.page-header h2{margin-bottom:8px}

/* ====== PROGRESS STEPS ====== */
.pipeline-steps{display:flex;gap:0;margin-bottom:32px;overflow-x:auto;padding-bottom:4px}
.pipeline-step{
  display:flex;align-items:center;gap:0;flex-shrink:0;
}
.step-node{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:0 4px;
}
.step-circle{
  width:36px;height:36px;border-radius:50%;
  border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:.8125rem;font-weight:700;color:var(--text3);
  background:var(--bg);transition:all var(--transition);flex-shrink:0;
}
.step-circle.done{background:var(--green);border-color:var(--green);color:#fff}
.step-circle.active{background:var(--text);border-color:var(--text);color:var(--bg)}
.step-circle.review{background:var(--amber);border-color:var(--amber);color:#fff}
.step-label{font-size:.7rem;font-weight:600;color:var(--text3);text-align:center;max-width:70px;line-height:1.3}
.step-label.active{color:var(--text)}
.step-connector{
  width:40px;height:2px;background:var(--border2);
  margin-bottom:22px;flex-shrink:0;
}
.step-connector.done{background:var(--green)}

/* ====== TABLE ====== */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{
  padding:10px 16px;text-align:left;font-size:.75rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--text3);
  background:var(--bg2);border-bottom:1px solid var(--border);
}
td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text2)}
td:first-child{color:var(--text);font-weight:500}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}

/* ====== ALERT ====== */
.alert{
  display:flex;gap:12px;align-items:flex-start;
  padding:14px 16px;border-radius:var(--radius);margin-bottom:16px;
  font-size:.875rem;
}
.alert-info{background:var(--blue-bg);color:var(--blue);border:1px solid color-mix(in srgb,var(--blue) 25%,transparent)}
.alert-warn{background:var(--amber-bg);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 25%,transparent)}
.alert-error{background:var(--red-bg);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 25%,transparent)}
.alert-success{background:var(--green-bg);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 25%,transparent)}

/* ====== STAT CARDS ====== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:20px;
}
.stat-value{font-size:2rem;font-weight:700;font-family:var(--font-mono);color:var(--text);line-height:1}
.stat-label{font-size:.8125rem;color:var(--text3);margin-top:6px;font-weight:500}
.stat-delta{font-size:.75rem;margin-top:4px}
.stat-delta.up{color:var(--green)}
.stat-delta.down{color:var(--red)}

/* ====== DRAG AND DROP ====== */
.drop-zone{
  border:2px dashed var(--border2);border-radius:var(--radius-lg);
  padding:40px;text-align:center;cursor:pointer;
  transition:all var(--transition);
}
.drop-zone:hover,.drop-zone.dragging{
  border-color:var(--text);background:var(--bg2);
}
.drop-zone-icon{font-size:2.5rem;margin-bottom:12px}
.drop-zone p{color:var(--text3);font-size:.9rem}
.drop-zone strong{color:var(--text)}

/* ====== SURVEY BUILDER ====== */
.question-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-lg);padding:20px;margin-bottom:12px;
  transition:all var(--transition);cursor:move;
}
.question-card:hover{border-color:var(--border2);box-shadow:var(--shadow-md)}
.question-card.selected{border-color:var(--text)}
.question-handle{color:var(--text3);cursor:grab;margin-right:8px}
.question-type-badge{font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--bg3);color:var(--text2)}

/* ====== LIKERT ====== */
.likert-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.likert-option{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 16px;border-radius:8px;border:1.5px solid var(--border);
  cursor:pointer;transition:all var(--transition);min-width:60px;
  background:var(--bg);
}
.likert-option:hover{border-color:var(--text);background:var(--bg2)}
.likert-option.selected{border-color:var(--text);background:var(--text);color:var(--bg)}
.likert-value{font-size:1.1rem;font-weight:700;font-family:var(--font-mono)}
.likert-label{font-size:.7rem;font-weight:600;text-align:center;white-space:nowrap}

/* ====== PIPELINE STATUS ====== */
.pipeline-status{
  display:flex;flex-direction:column;gap:12px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:24px;
}
.pipeline-stage{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:var(--radius);
  background:var(--bg2);
}
.stage-icon{
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:.875rem;font-weight:700;flex-shrink:0;
}
.stage-icon.pending{background:var(--bg3);color:var(--text3)}
.stage-icon.running{background:var(--blue-bg);color:var(--blue)}
.stage-icon.done{background:var(--green-bg);color:var(--green)}
.stage-icon.review{background:var(--amber-bg);color:var(--amber)}
.stage-icon.failed{background:var(--red-bg);color:var(--red)}
.stage-name{font-weight:600;font-size:.875rem;color:var(--text);flex:1}
.stage-desc{font-size:.8125rem;color:var(--text3)}

/* ====== CODE BLOCK ====== */
.code-block{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 20px;
  font-family:var(--font-mono);font-size:.8125rem;
  overflow-x:auto;white-space:pre;color:var(--text);line-height:1.7;
}

/* ====== MODAL ====== */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:var(--surface);border-radius:var(--radius-xl);
  padding:32px;max-width:600px;width:100%;
  box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;
}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.modal-title{font-family:var(--font-display);font-size:1.5rem;color:var(--text)}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px}

/* ====== RESPONSIVE ====== */
@media(max-width:768px){
  .sidebar-layout{grid-template-columns:1fr}
  .sidebar{position:relative;top:auto;height:auto;border-right:none;border-bottom:1px solid var(--border)}
  .main-content{padding:20px 16px}
  .nav-links{display:none}
}

/* ====== ANIMATIONS ====== */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-in{animation:fadeIn .3s ease forwards}
.spin{animation:spin 1s linear infinite}
.pulse{animation:pulse 1.5s ease infinite}

/* ====== LOADING ====== */
.spinner{
  width:20px;height:20px;border:2px solid var(--border2);
  border-top-color:var(--text);border-radius:50%;
  animation:spin 0.8s linear infinite;display:inline-block;
}
.loading-bar{
  height:3px;background:var(--border);border-radius:2px;overflow:hidden;
}
.loading-bar-fill{
  height:100%;background:var(--text);border-radius:2px;
  animation:loadBar 1.5s ease infinite;
}
@keyframes loadBar{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}

/* ====== EMPTY STATE ====== */
.empty-state{text-align:center;padding:60px 20px}
.empty-state-icon{font-size:3rem;margin-bottom:16px;opacity:.4}
.empty-state h3{color:var(--text);margin-bottom:8px;font-family:var(--font-display)}
.empty-state p{color:var(--text3);font-size:.9rem;max-width:360px;margin:0 auto 24px}

/* ====== TOGGLE ====== */
.toggle{position:relative;display:inline-block;width:44px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{
  position:absolute;inset:0;border-radius:12px;
  background:var(--border2);cursor:pointer;transition:all var(--transition);
}
.toggle-slider::after{
  content:'';position:absolute;width:18px;height:18px;
  border-radius:50%;background:#fff;
  top:3px;left:3px;transition:all var(--transition);
}
.toggle input:checked + .toggle-slider{background:var(--text)}
.toggle input:checked + .toggle-slider::after{transform:translateX(20px)}

/* ====== CHART PLACEHOLDER ====== */
.chart-placeholder{
  background:var(--bg2);border:1px dashed var(--border2);
  border-radius:var(--radius);padding:40px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  color:var(--text3);text-align:center;
}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:80px}
.chart-bar{width:20px;border-radius:4px 4px 0 0;background:var(--border2)}

/* ====== DECODE REVIEW ====== */
.variable-row{
  display:grid;grid-template-columns:1fr 120px 120px 100px 80px;
  gap:12px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--border);
}
.variable-row:last-child{border-bottom:none}
.variable-row-header{
  font-size:.75rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text3);
}

/* ====== SURVEY RESPONDENT VIEW ====== */
.survey-page{
  min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;
}
.survey-header{
  background:var(--text);color:var(--bg);
  padding:32px 24px;text-align:center;
}
.survey-header h1{font-family:var(--font-display);font-size:1.8rem;color:inherit;margin-bottom:8px}
.survey-header p{opacity:.75;font-size:.9rem;color:inherit}
.survey-progress{
  height:4px;background:rgba(255,255,255,.2);
}
.survey-progress-fill{height:100%;background:#fff;transition:width .4s ease}
.survey-body{flex:1;max-width:680px;margin:0 auto;width:100%;padding:40px 24px}
.survey-question{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:28px;margin-bottom:20px;
}
.question-number{
  font-size:.75rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text3);margin-bottom:8px;
}
.question-text{font-size:1.05rem;font-weight:600;color:var(--text);margin-bottom:20px;line-height:1.5}
.required-star{color:var(--red);margin-left:3px}

/* ====== REPORT PREVIEW ====== */
.report-preview{
  background:#fff;color:#212121;
  font-family:'Times New Roman',serif;
  max-width:800px;margin:0 auto;padding:40px;
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  line-height:2;font-size:12pt;
}
.report-preview h2{font-size:14pt;font-weight:bold;text-transform:uppercase;text-align:center;margin:24px 0 12px}
.report-preview p{margin-bottom:12px;text-indent:0.5in}
.report-preview table{width:100%;border-collapse:collapse;margin:20px 0;font-size:11pt}
.report-preview th,.report-preview td{border:1px solid #999;padding:6px 10px}
.report-preview th{background:#f5f5f5;font-weight:bold;text-align:center}

/* ====== QR CODE ====== */
.qr-container{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:24px;text-align:center;
}
.qr-placeholder{
  width:180px;height:180px;background:var(--bg3);
  border-radius:8px;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;color:var(--text3);font-family:var(--font-mono);
}

/* ====== GRID HELPERS ====== */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* ====== FLEX HELPERS ====== */
.flex{display:flex}.flex-col{flex-direction:column}
.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.flex-1{flex:1}.flex-wrap{flex-wrap:wrap}
.ml-auto{margin-left:auto}

/* ====== SPACING ====== */
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}
.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}.mb-8{margin-bottom:32px}
.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.p-0{padding:0}

/* ====== DIVIDER ====== */
.divider{border:none;border-top:1px solid var(--border);margin:20px 0}
</style>
</head>
<body data-theme="light">
<div id="app">
  <!-- App renders here -->
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;gap:12px;color:var(--text3)">
    <div class="spinner"></div>
    <span style="font-family:var(--font-body);font-size:.9rem">Loading ResearchForm…</span>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
